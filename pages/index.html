<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       SHRT.NAME // SYNTHWAVE AESTHETIC
       ═══════════════════════════════════════════════════════════════════ */
    :root {
      /* Deep Void Backgrounds */
      --bg-void: #050508;
      --bg-surface: rgba(16, 16, 28, 0.6);
      --bg-glass: rgba(26, 26, 46, 0.4);
      
      /* Vibrant Core Neons */
      --neon-cyan: #0ff0fc;
      --neon-cyan-dim: rgba(15, 240, 252, 0.2);
      --neon-magenta: #ff00ff;
      --neon-purple: #9d00ff;

      /* Text Colors */
      --text-primary: #ffffff;

      --text-muted: #565f89;
      
      /* Typography */
      --font-display: 'Orbitron', system-ui, sans-serif;
      --font-mono: 'Space Mono', monospace;
      
      /* Effects */
      --glow-cyan: 0 0 15px rgba(15, 240, 252, 0.5), inset 0 0 10px rgba(15, 240, 252, 0.2);
      --glow-magenta: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 10px rgba(255, 0, 255, 0.2);
      --blur-md: backdrop-filter: blur(12px) saturate(180%);
    }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-mono);
      background-color: var(--bg-void);
      /* Premium Grid Background */
      background-image: 
        linear-gradient(rgba(15, 240, 252, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 240, 252, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15) 0%, transparent 60%);

      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }
    
    /* CRT Scanline Overlay */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      opacity: 0.6;

    .container {
      max-width: 640px;
      width: 100%;

      z-index: 10;
    }
    
    .header {

      margin-bottom: 3.5rem;

    .logo {

    .logo-suffix {

    .input-group {

    input {

    button {

      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.1);
    }
    
    /* Button shine effect */
    button::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: skewX(-20deg);
      transition: 0.5s;

    button:hover {
      border-color: var(--neon-cyan);

    }
    button:hover::before {
      left: 150%;
    }
    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(15, 240, 252, 0.3);
    }
    button:disabled {
      background: rgba(10, 10, 15, 0.5);

    }
    button:disabled::before {
      display: none;
    }
    #result {
      margin-top: 2.5rem;

    }
    @keyframes expandIn {
      0% { opacity: 0; transform: scaleY(0.8) translateY(-20px); filter: blur(10px); }
      100% { opacity: 1; transform: scaleY(1) translateY(0); filter: blur(0); }
    }
    #result.visible {
      display: block;
    }
    .result-header {
      display: flex;
      align-items: center;

    .result-header::before {
      content: '';

    }
    .result-status {
      font-size: 1.75rem;

    .result-content {
      display: flex;
      flex-direction: column;

      color: var(--neon-cyan);
      text-shadow: 0 0 15px var(--neon-cyan);
    }
    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 0.5rem 0;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem;
      background: rgba(15, 240, 252, 0.03);
      border: 1px solid rgba(15, 240, 252, 0.1);
      border-radius: 8px;
      transition: all 0.2s ease-out;
      position: relative;
      overflow: hidden;
    }
    .stat-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      opacity: 0;
      transition: 0.3s;
    }
    .stat-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      background: rgba(15, 240, 252, 0.08);
      border-color: rgba(15, 240, 252, 0.3);
    }
    .stat-item:hover::before {
      opacity: 1;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;

    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 1.5rem;

    .result-actions {
      display: flex;
      gap: 1rem;

    }
    .action-button {
      flex: 1;
      padding: 1.25rem 1rem;
      font-family: var(--font-display);
      font-size: 0.8rem;

      letter-spacing: 0.15em;

    .qr-section {

    }
    .qr-container {
      display: inline-block;
      position: relative;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }
    .qr-container:hover {
      transform: scale(1.05);
      border-color: rgba(15, 240, 252, 0.3);
      box-shadow: 0 0 20px rgba(15, 240, 252, 0.15);
    }
    .qr-image {
      width: 160px;
      height: 160px;
      display: block;
      border-radius: 8px;
    }
    .qr-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s ease-out;
    }
    .qr-download:hover {
      color: #fff;
      border-color: var(--neon-cyan);
      background: rgba(15, 240, 252, 0.1);
      box-shadow: 0 0 15px rgba(15, 240, 252, 0.2);
    }
    .footer {
      margin-top: 4rem;
      text-align: center;

      text-transform: uppercase;
    }
    .footer a {

      text-decoration: none;
      transition: all 0.15s ease-out;
    }
    .footer a:hover {

      text-shadow: 0 0 10px var(--neon-magenta);
    }
    .admin-link {
      position: fixed;
      bottom: 20px;

<body>

  <div class="container">
    <header class="header">
      <h1 class="logo">
        <span class="logo-prefix">SHRT</span><span class="logo-separator">//</span><span class="logo-suffix">NAME</span>
      </h1>
      <p class="tagline">COMPRESS//THE//INTERNET</p>
    </header>

    <form id="shorten-form" class="form">
      <div class="input-group">
        <input type="url" id="url-input" placeholder="https://example.com/very-long-url" required autocomplete="off" />
      </div>

      <div class="input-group">
        <input type="text" id="code-input" placeholder="Custom short link (optional)" autocomplete="off" />
      </div>

      <button type="submit" id="submit-btn" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Shorten URL
      </button>
    </form>

    <div id="result">
      <div class="result-header">
        <span class="result-status">✓</span>
        <h2 class="result-title">URL Shortened</h2>
      </div>

      <div class="result-content">
        <div class="result-field">
          <label class="result-label">Your Short URL</label>
          <div class="result-value">
            <a href="#" id="short-url" target="_blank" class="result-link"></a>
          </div>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">CLICKS</span>
            <span class="stat-value" id="stat-clicks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">TYPE</span>
            <span class="stat-value" id="stat-type">AUTO</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">CODE</span>
            <span class="stat-value" id="stat-code"></span>
          </div>
        </div>

        <div class="result-actions">
          <button class="action-button copy-btn" id="copy-btn">
            Copy to Clipboard
          </button>
          <button class="action-button stats-btn" id="view-stats-btn">
            View Analytics
          </button>
        </div>

        <div class="qr-section">
          <div class="qr-container">
            <img id="qr-code" src="" alt="QR CODE" class="qr-image" loading="lazy">
          </div>
          <a href="#" id="qr-download" target="_blank" class="qr-download">Download QR</a>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>SHRT.NAME // 2026</p>
      <p style="margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.05em; text-transform: none;">
        Do you use social media? Try <a href="/crossposting">crosspostingpal.com</a>
      </p>
    </footer>
  </div>

  <a href="/admin" class="admin-link">[ADMIN]</a>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('short-url');
    const statClicks = document.getElementById('stat-clicks');
    const statType = document.getElementById('stat-type');
    const statCode = document.getElementById('stat-code');
    const copyBtn = document.getElementById('copy-btn');
    const viewStatsBtn = document.getElementById('view-stats-btn');
    const qrCode = document.getElementById('qr-code');
    const qrDownload = document.getElementById('qr-download');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const code = codeInput.value.trim();

      if (!url) {
        alert('Please enter a URL to shorten.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Shortening...';

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, code: code || null })
        });

        const data = await response.json();

        if (data.success) {
          shortUrl.href = data.short_url;
          shortUrl.textContent = data.short_url;
          statClicks.textContent = '0';
          statType.textContent = data.custom_code ? 'CUSTOM' : 'AUTO';
          statCode.textContent = data.code;

          const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(data.short_url) + '&color=0ff0fc&bgcolor=050508';
          qrCode.src = qrUrl;
          qrDownload.href = qrUrl;

          result.classList.add('visible');
          setTimeout(() => {
            result.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        } else {
          alert(data.error || 'Failed to shorten URL. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Shorten URL';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.textContent);
        alert('Copied to clipboard!');
      } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = shortUrl.textContent;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('Copied to clipboard!');
      }
    });

    viewStatsBtn.addEventListener('click', async () => {
      const code = statCode.textContent;
      const response = await fetch('/api/stats/' + code);
      const data = await response.json();

      if (data.success) {
        alert('CLICKS: ' + data.clicks + '\nCREATED: ' + new Date(data.created_at).toLocaleString());
      } else {
        alert('Failed to load statistics.');
      }
    });
  </script>
