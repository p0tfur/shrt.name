<body>
  <script>
    // Check for saved variant preference
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentVariant = urlParams.get('variant');
      if (!currentVariant) {
        const savedVariant = localStorage.getItem('shrtname_variant');
        if (savedVariant && savedVariant !== 'synthwave') {
          window.location.href = '/?variant=' + savedVariant;
        }
      } else {
        localStorage.setItem('shrtname_variant', currentVariant);
      }
    })();
  </script>
  <div class="container">

    </header>

    <form id="shorten-form" class="form">
      <div class="input-group">
        <input type="url" id="url-input" placeholder="INPUT_URL_STREAM" required autocomplete="off" />
      </div>

      <div class="input-group">
        <input type="text" id="code-input" placeholder="CUSTOM_CODENAME" autocomplete="off" />
      </div>

      <button type="submit" id="submit-btn">INITIATE_COMPRESSION</button>
    </form>

    <div id="result">
      <div class="result-header">
        <span class="result-status">✓</span>
        <h2 class="result-title">COMPRESSION_COMPLETE</h2>
      </div>

      <div class="result-content">
        <div class="result-field">
          <label class="result-label">COMPRESSED_URL</label>
          <div class="result-value">
            <a href="#" id="short-url" target="_blank" class="result-link"></a>
          </div>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">CLICKS</span>
            <span class="stat-value" id="stat-clicks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">TYPE</span>
            <span class="stat-value" id="stat-type">AUTO</span>
          </div>

            <span class="stat-label">CODE</span>
            <span class="stat-value" id="stat-code"></span>
          </div>
        </div>

        <div class="result-actions">

            COPY_TO_CLIPBOARD
          </button>

            VIEW_ANALYTICS
          </button>
        </div>

          <div class="qr-container">
            <img id="qr-code" src="" alt="QR CODE" class="qr-image" loading="lazy">
          </div>
          <a href="#" id="qr-download" target="_blank" class="qr-download">DOWNLOAD_QR</a>
        </div>
      </div>

      <p>SHRT.NAME // 2024 // SYSTEM_ONLINE</p>
    </footer>

  <a href="/admin" class="admin-link">[ADMIN]</a>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('short-url');
    const statClicks = document.getElementById('stat-clicks');
    const statType = document.getElementById('stat-type');
    const statCode = document.getElementById('stat-code');
    const copyBtn = document.getElementById('copy-btn');
    const viewStatsBtn = document.getElementById('view-stats-btn');
    const qrCode = document.getElementById('qr-code');
    const qrDownload = document.getElementById('qr-download');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const code = codeInput.value.trim();

      if (!url) {
        alert('URL_REQUIRED');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'COMPRESSING...';

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, code: code || null })
        });

        const data = await response.json();

        if (data.success) {
          shortUrl.href = data.short_url;
          shortUrl.textContent = data.short_url;
          statClicks.textContent = '0';
          statType.textContent = data.custom_code ? 'CUSTOM' : 'AUTO';
          statCode.textContent = data.code;

          const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(data.short_url) + '&color=00f3ff&bgcolor=1a1a2e';
          qrCode.src = qrUrl;
          qrDownload.href = qrUrl;

          result.classList.add('visible');
          result.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          alert(data.error || 'COMPRESSION_FAILED');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('NETWORK_ERROR');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'INITIATE_COMPRESSION';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.textContent);
        alert('COPIED_TO_CLIPBOARD');
      } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = shortUrl.textContent;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('COPIED_TO_CLIPBOARD');
      }
    });

    viewStatsBtn.addEventListener('click', async () => {
      const code = statCode.textContent;
      const response = await fetch('/api/stats/' + code);
      const data = await response.json();

      if (data.success) {
        alert('CLICKS: ' + data.clicks + '\\nCREATED: ' + new Date(data.created_at).toLocaleString());
      } else {
        alert('FAILED_TO_LOAD_STATS');
      }
    });
  </script>
