<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shrt.name // RETRO-FUTURISTIC</title>
  <meta name="description" content="Retro-futuristic URL shortener with synthwave aesthetics. Grid distortions, CRT effects, and neon glow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Neon Color Palette */
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0080;
      --neon-green: #00ff88;
      --neon-blue: #0066ff;

      /* Background Colors */
      --bg-void: #0a0a0f;
      --bg-grid: #1a1a2e;
      --bg-tertiary: #050a10;

      /* Text Colors */
      --text-primary: #ffffff;
      --text-secondary: #b8b8d4;
      --text-muted: #666699;

      /* Spacing */
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
      --space-xl: 6rem;

      /* Border Radius */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-xl: 32px;

      /* Transitions */
      --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 0.15s ease-out;

      /* Glow Intensities */
      --glow-subtle: 0 0 10px;
      --glow-medium: 0 0 20px;
      --glow-intense: 0 0 30px;
    }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-display), var(--font-mono);
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    /* CRT Overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 243, 255, 0.03) 2px,
        rgba(0, 243, 255, 0.03) 4px,
        transparent
      );
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
      animation: scanlineScroll 0.1s linear infinite;
    }

    @keyframes scanlineScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle at center,
        transparent 50%,
        rgba(0, 0, 0, 0.85) 100%
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* Animated Grid Background */
    .grid-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .grid-horizontal {
      position: absolute;
      width: 200%;
      height: 2px;
      top: 50%;
      left: -50%;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      animation: gridPulse 4s ease-in-out infinite;
    }

    .grid-vertical {
      position: absolute;
      width: 2px;
      height: 200%;
      top: -50%;
      left: 50%;
      background: linear-gradient(90deg, transparent, var(--neon-magenta), transparent);
      animation: gridPulse 4s ease-in-out infinite;
      animation-delay: 2s;
    }

    @keyframes gridPulse {
      0%, 100% {
        opacity: 0.3;
        filter: drop-shadow(var(--glow-subtle) var(--neon-cyan));
      }
      50% {
        opacity: 0.6;
        filter: drop-shadow(var(--glow-medium) var(--neon-magenta));
      }
    }

    .grid-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle at 20% 80%,
        rgba(0, 243, 255, 0.08) 0%,
        rgba(255, 0, 255, 0) 50%
      );
      animation: glowShift 8s ease-in-out infinite;
    }

    @keyframes glowShift {
      0%, 100% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
      33% {
        opacity: 0.8;
        transform: scale(1.2) translate(-5%, 5%);
      }
      66% {
        opacity: 0.9;
        transform: scale(1.1) translate(5%, -5%);
      }
    }

    /* Main Container */
    .main-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: var(--space-xl);
      animation: headerReveal 0.8s ease-out forwards;
      opacity: 0;
    }

    @keyframes headerReveal {
      from {
        opacity: 0;
        transform: translateY(-30px);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -0.05em;
      margin-bottom: var(--space-sm);
      position: relative;
      display: inline-block;
    }

    .logo-prefix {
      color: var(--neon-cyan);
      text-shadow:
        0 0 10px var(--neon-cyan),
        0 0 20px var(--neon-cyan),
        0 0 40px var(--neon-cyan),
        0 0 80px var(--neon-cyan);
      }

    .logo-separator {
      color: var(--neon-magenta);
      margin: 0 0.25em;
      animation: separatorBlink 2s infinite;
    }

    @keyframes separatorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .logo-suffix {
      color: var(--neon-purple);
      text-shadow:
        0 0 10px var(--neon-purple),
        0 0 20px var(--neon-purple),
        0 0 40px var(--neon-purple),
        0 0 80px var(--neon-purple);
    }

    .tagline {
      font-family: var(--font-mono);
      font-size: clamp(0.875rem, 2vw, 1.125rem);
      letter-spacing: 0.3em;
      color: var(--text-secondary);
      text-transform: uppercase;
      animation: glitchText 3s infinite;
    }

    .glitch-text {
      position: relative;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    .glitch-text::before {
      color: var(--neon-cyan);
      animation: glitch1 2s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 45%, 0 0 45%, 0 0 45%);
    }

    .glitch-text::after {
      color: var(--neon-magenta);
      animation: glitch2 3s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 55%, 100% 100%, 0 0 55%);
    }

    @keyframes glitch1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      80% { transform: translate(0); }
    }

    @keyframes glitch2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(2px, 2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      80% { transform: translate(0); }
    }

    /* Form Section */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      animation: formReveal 0.6s ease-out 0.2s forwards;
      opacity: 0;
    }

    @keyframes formReveal {
      from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .input-group {
      position: relative;
      animation: inputReveal 0.6s ease-out forwards;
      opacity: 0;
    }

    .input-group:nth-child(1) { animation-delay: 0.3s; }
    .input-group:nth-child(2) { animation-delay: 0.4s; }

    @keyframes inputReveal {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      border-left: 2px solid var(--neon-cyan);
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.05), transparent);
    }

    .form-label-icon {
      font-size: 1.25rem;
    }

    .form-label-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .form-label-optional {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.625rem;
      font-weight: 400;
    }

    .form-input {
      width: 100%;
      padding: var(--space-md) var(--space-sm);
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-primary);
      background: rgba(26, 26, 46, 0.8);
      border: 2px solid rgba(0, 243, 255, 0.2);
      border-radius: var(--radius-md);
      position: relative;
      z-index: 1;
      transition: all var(--transition-normal);
    }

    .form-input::placeholder {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow:
        0 0 10px rgba(0, 243, 255, 0.3),
        inset 0 0 20px rgba(0, 243, 255, 0.05);
      background: rgba(26, 26, 46, 0.95);
    }

    .form-input:focus + .input-border {
      opacity: 1;
      animation: borderGlow 2s infinite;
    }

    @keyframes borderGlow {
      0%, 100% {
        box-shadow:
          0 0 10px rgba(0, 243, 255, 0.5),
          inset 0 0 20px rgba(0, 243, 255, 0.1);
      }
      50% {
        box-shadow:
          0 0 20px rgba(0, 243, 255, 0.8),
          inset 0 0 40px rgba(0, 243, 255, 0.2);
      }
      100% {
        box-shadow:
          0 0 10px rgba(0, 243, 255, 0.5),
          inset 0 0 20px rgba(0, 243, 255, 0.1);
      }
    }

    .input-border {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      border-radius: var(--radius-md);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .input-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(0, 243, 255, 0.1) 0%,
        transparent 70%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    .form-input:focus ~ .input-glow {
      opacity: 1;
      animation: inputGlowPulse 3s ease-in-out infinite;
    }

    @keyframes inputGlowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.5;
      }
    }

    /* Submit Button */
    .submit-button {
      position: relative;
      width: 100%;
      padding: var(--space-md);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-primary);
      background: transparent;
      border: 2px solid var(--neon-magenta);
      border-radius: var(--radius-md);
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition-normal);
      text-transform: uppercase;
    }

    .submit-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.3), transparent);
      transition: left 0.6s ease-out;
      animation: buttonScan 2s infinite linear forwards;
    }

    @keyframes buttonScan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .submit-button::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.3), transparent);
      transition: left 0.6s ease-out;
    }

    .submit-button:hover {
      border-color: var(--neon-cyan);
    box-shadow:
      0 0 10px rgba(0, 243, 255, 0.3),
        0 0 20px rgba(0, 243, 255, 0.1);
        0 0 40px rgba(0, 243, 255, 0.2);
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: rgba(0, 243, 255, 0.2);
    }

    /* Button Text */
    .button-text {
      position: relative;
      z-index: 2;
      transition: text-shadow var(--transition-fast);
    }

    .submit-button:hover .button-text {
      text-shadow:
        0 0 10px var(--neon-cyan),
        0 0 20px var(--neon-cyan),
        0 0 40px var(--neon-cyan),
        0 0 80px var(--neon-cyan);
    }

    /* Button Glitch */
    .button-glitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(255, 0, 255, 0.1) 2px,
          transparent
        );
      transition: opacity var(--transition-fast);
    }

    .submit-button:hover .button-glitch {
      opacity: 1;
      animation: buttonGlitch 0.3s infinite;
    }

    @keyframes buttonGlitch {
      0% {
        clip-path: polygon(0 0 100% 0, 45%, 0 0 45%, 0 100% 0);
      }
      50% {
        clip-path: polygon(0 0 100% 55%, 100% 100%, 0 0 55%);
      }
    }

    /* Button Scan */
    .button-scan {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.3), transparent);
      transition: left 0.6s ease-out;
    }

    /* Button Glow */
    .button-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(0, 243, 255, 0.2) 0%,
        transparent 70%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    .submit-button:hover .button-glow {
      opacity: 1;
      animation: buttonGlowPulse 3s ease-in-out infinite;
    }

    /* Result Section */
    .result-section {
      display: none;
      margin-top: var(--space-lg);
      padding: var(--space-lg);
      background: rgba(26, 26, 46, 0.9);
      border: 2px solid var(--neon-green);
      border-radius: var(--radius-lg);
      box-shadow:
        0 0 10px rgba(0, 255, 136, 0.3),
        0 0 20px rgba(0, 255, 136, 0.2),
        0 0 40px rgba(0, 255, 136, 0.05),
        0 0 80px rgba(0, 255, 136, 0.1);
      }
      opacity: 0;
      transform: translateY(20px);
      animation: resultFadeIn 0.6s ease-out forwards;
      border-left: 3px solid var(--neon-green);
      animation: resultScan 2s linear infinite;
    }

    @keyframes resultFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes resultScan {
      0% {
        transform: translateX(-100%);
      opacity: 0.05;
      }
      50% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .result-section.visible {
      display: block;
    }

    .result-container {
      padding: var(--space-md);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      padding: var(--space-sm);
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      background: rgba(26, 26, 46, 0.9);
    }

    .result-icon {
      font-size: 1.5rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
      animation: statusPulse 2s infinite;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    .result-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .result-content {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .result-field {
      position: relative;
    }

    .result-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
    }

    .result-value {
      padding: var(--space-sm);
      background: rgba(0, 0, 0, 0, 0.3);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .short-url {
      display: block;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      font-size: 1.125rem;
      font-weight: 500;
      text-decoration: none;
      word-break: break-all;
      transition: color var(--transition-fast);
    }

    .short-url:hover {
      color: var(--neon-magenta);
      text-shadow: 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta);
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
      margin: var(--space-md) 0;
    }

    .stat-item {
      text-align: center;
      padding: var(--space-sm);
      background: rgba(0, 0, 0, 0, 0.3);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .stat-item:hover {
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 136, 0.2);
    }

    .stat-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
      transition: color var(--transition-fast);
    }

    .result-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .action-button {
      flex: 1;
      padding: var(--space-sm);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      background: rgba(0, 0, 0, 0, 0.3);
      border: 1px solid var(--neon-cyan);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-transform: uppercase;
    }

    .action-button:hover {
      background: var(--neon-cyan);
      color: var(--text-primary);
      box-shadow: 0 0 15px rgba(0, 243, 255, 136, 0.2);
      transform: translateY(-2px);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    }

    .action-button:active {
      transform: translateY(0);
    }

    .result-actions .copy-btn {
      background: var(--neon-green);
      border-color: var(--neon-green);
    }

    .result-actions .stats-btn {
      background: var(--neon-purple);
      border-color: var(--neon-purple);
    }

    .qr-section {
      text-align: center;
      margin-top: var(--space-md);
      padding: var(--space-sm);
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
    }

    .qr-container {
      display: inline-block;
      padding: var(--space-sm);
      background: rgba(0, 0, 0, 0, 0.3);
      border: 2px solid var(--neon-green);
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2);
      border-radius: var(--radius-md);
      transition: transform var(--transition-slow), box-shadow var(--transition-slow);
    }

    .qr-image {
      width: 150px;
      height: 150px;
      display: block;
      filter: hue-rotate(180deg) contrast(1.5) brightness(1.5) saturate(0.5);

    }

    .qr-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(0, 243, 255, 0.1) 2px,
          transparent
        );
      opacity: 0.1;
      background-size: 30px 30px;
      background-position: 0 0, 30px;
      animation: qrScan 4s linear infinite;
    }

    @keyframes qrScan {
      0% { background-position: 0 30px; }
      100% { background-position: 30px 60px; }

    <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('short-url');
    const statClicks = document.getElementById('stat-clicks');
    const statType = document.getElementById('stat-type');
    const statCode = document.getElementById('stat-code');
    const copyBtn = document.getElementById('copy-btn');
    const viewStatsBtn = document.getElementById('view-stats-btn');
    const qrCode = document.getElementById('qr-code');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const code = codeInput.value.trim();

      if (!url) {
        alert('Please enter a URL');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'COMPRESSING...';

      try {
        const response = await fetch('https://shrt-name.p-wesolowski.workers.dev/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, code: code || null })
        });

        const data = await response.json();

        if (data.success) {
          shortUrl.href = data.short_url;
          shortUrl.textContent = data.short_url;
          statClicks.textContent = '0';
          statType.textContent = data.custom_code ? 'CUSTOM' : 'AUTO';
          statCode.textContent = data.code;

          const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(data.short_url) + '&color=00f3ff&bgcolor=0a0a0f';
          qrCode.src = qrUrl;

          result.classList.add('visible');
          result.scrollIntoView({ behavior: 'smooth', block: 'center' });

          // Trigger particle effect
          createParticles();
        } else {
          alert(data.error || 'Failed to shorten URL');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'INITIATE_COMPRESSION';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.textContent);
        alert('Copied to clipboard');
      } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = shortUrl.textContent;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('Copied to clipboard');
      }
    });

    viewStatsBtn.addEventListener('click', async () => {
      const code = statCode.textContent;
      const response = await fetch('https://shrt-name.p-wesolowski.workers.dev/api/stats/' + code);
      const data = await response.json();

      if (data.success) {
        alert('Clicks: ' + data.clicks + '\nCreated: ' + new Date(data.created_at).toLocaleString());
      }
    });

    // Particle System
    function createParticles() {
      const colors = ['#00f3ff', '#ff00ff', '#bc13fe', '#00ff88'];

      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.random() * 4 + 2;
        const startX = event.clientX;
        const startY = event.clientY;

        particle.style.cssText = `
          position: fixed;
          top: 0;
          left: ${startX}px;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          border-radius: ${size / 2}px;
          pointer-events: none;
          z-index: 10000;
          animation: particleFade 4s ease-out forwards;
          transform-origin: -${startX}px, -${startY}px;
        `;

        document.body.appendChild(particle);

        const vx = (Math.random() - 0.5) * 4;
        const vy = (Math.random() - 0.5) * 4;
        const life = 1;
        const decay = 0.02 + Math.random() * 0.02;

        const updateParticle = () => {
          particle.style.transform = `translate(${vx}px, ${vy}px) rotate(${particle.dataset.rotation}deg)`;
          particle.style.opacity = life;
          particle.dataset.rotation += (Math.random() - 0.5) * 360 / particle.dataset.rotation);
          life -= decay;

          if (life <= 0) {
            particle.remove();
          return;
          }

          particle.addEventListener('animationend', updateParticle);
          requestAnimationFrame(updateParticle);
        };

        requestAnimationFrame(updateParticle);
      }

      // Add particle fade animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes particleFade {
          to {
            opacity: 0;
            transform: translateY(100vh);
          }
        }
      `;
      document.head.appendChild(style);
    </script>
