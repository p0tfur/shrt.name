      /* Soft Pastel Colors */

      --pink-medium: #ff99c8;
      --purple-pale: #e8d5f2;

    /* Submit Button */

    /* Decorative elements */

    /* Responsive */
    @media (max-width: 768px) {

    /* Scrollbar */

  </style>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentVariant = urlParams.get('variant');
      if (!currentVariant) {
        const savedVariant = localStorage.getItem('shrtname_variant');
        if (savedVariant) {
          window.location.href = '/?variant=' + savedVariant;
        }
      } else {
        localStorage.setItem('shrtname_variant', currentVariant);
      }
    })();
  </script>

  <div class="container">

    <header class="header">

    <!-- Footer -->
    
  <footer style="text-align: center; padding: 2rem; font-family: monospace; font-size: 0.75rem; color: #666; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3rem; border-top: 1px solid #333;">
    shrt.name // 2026 // MIT // BUILD: 2026.02.15.01
  </footer>

  </div>

  <script>
    // DOM Elements
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('url');
    const customCodeInput = document.getElementById('customCode');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('shortUrl');
    const originalUrl = document.getElementById('originalUrl');
    const copyBtn = document.getElementById('copyBtn');
    const visitBtn = document.getElementById('visitBtn');
    const qrSection = document.getElementById('qrSection');
    const qrCode = document.getElementById('qrCode');
    const statsSection = document.getElementById('statsSection');
    const clickCount = document.getElementById('clickCount');
    const createdAt = document.getElementById('createdAt');
    const codeType = document.getElementById('codeType');

    // API Base
    const API_BASE = window.location.origin;

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const customCode = customCodeInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      if (!isValidUrl(url)) {
        showError('Please enter a valid URL');
        return;
      }

      hideError();
      hideResult();
      showLoading();

      try {
        const response = await fetch(`${API_BASE}/api/shorten`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            url: url,
            code: customCode || undefined
          }),
        });

        const data = await response.json();

        if (response.ok) {
          showResult(data);
        } else {
          showError(data.error || 'Failed to shorten URL');
        }
      } catch (err) {
        showError('Network error. Please try again.');
        console.error(err);
      } finally {
        hideLoading();
      }
    });

    // Copy button
    copyBtn.addEventListener('click', async () => {
      const url = shortUrl.textContent;
      try {
        await navigator.clipboard.writeText(url);
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => {
          copyBtn.textContent = '📋 Copy';
        }, 2000);
      } catch (err) {
        showError('Failed to copy to clipboard');
      }
    });

    // Visit button
    visitBtn.addEventListener('click', () => {
      window.open(shortUrl.textContent, '_blank');
    });

    // Validate URL
    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    // Show/Hide helpers
    function showLoading() {
      loading.style.display = 'block';
    }

    function hideLoading() {
      loading.style.display = 'none';
    }

    function showError(message) {
      error.textContent = message;
      error.style.display = 'block';
    }

    function hideError() {
      error.style.display = 'none';
      error.textContent = '';
    }

    function showResult(data) {
      shortUrl.textContent = data.short_url;
      originalUrl.textContent = data.original_url;
      result.classList.add('show');
      qrSection.classList.add('show');

      // Generate QR code
      generateQRCode(data.short_url);

      // Fetch stats
      fetchStats(data.code);
    }

    function hideResult() {
      result.classList.remove('show');
      qrSection.classList.remove('show');
      statsSection.classList.remove('show');
    }

    // Generate QR code
    function generateQRCode(url) {
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&bgcolor=fffbf7&color=5a4a5c`;
      qrCode.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
    }

    // Fetch stats
    async function fetchStats(code) {
      try {
        const response = await fetch(`${API_BASE}/api/stats/${code}`);
        const data = await response.json();

        if (response.ok) {
          statsSection.classList.add('show');
          clickCount.textContent = data.clicks;
          createdAt.textContent = new Date(data.created_at).toLocaleDateString();
          codeType.textContent = data.custom_code ? 'Custom' : 'Auto-generated';
        }
      } catch (err) {
        console.error('Failed to fetch stats:', err);
      }
    }

    // Prevent Enter in custom code
    customCodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
      }
    });

    // Focus URL input on load
    urlInput.focus();

    // Add floating emoji animation
    document.addEventListener('DOMContentLoaded', () => {
      const emojis = ['🌸', '✨', '💖', '🌺', '💕', '🌷'];
      setInterval(() => {
        if (Math.random() < 0.2) {
          const emoji = document.createElement('div');
          emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          emoji.style.position = 'fixed';
          emoji.style.left = Math.random() * 100 + 'vw';
          emoji.style.top = '-30px';
          emoji.style.fontSize = '1.5rem';
          emoji.style.opacity = '0.3';
          emoji.style.pointerEvents = 'none';
          emoji.style.zIndex = '0';
          emoji.style.transition = 'transform 4s linear, opacity 4s linear';
          document.body.appendChild(emoji);

          setTimeout(() => {
            emoji.style.transform = 'translateY(' + (window.innerHeight + 100) + 'px)';
            emoji.style.opacity = '0';
          }, 100);

          setTimeout(() => {
            emoji.remove();
          }, 4100);
        }
      }, 2000);
    });
  </script>
