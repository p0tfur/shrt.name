<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRT.NAME // CYBER_GLITCH_V2.0</title>
  <meta name="description" content="Aggressive URL shortener. Glitch aesthetics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      /* CYBER GLITCH Color Palette */
      --surface: #09090b;
      --surface-light: #121214;
      --surface-border: #1a1a1e;
      --neon-yellow: #facc15;
      --neon-yellow-glow: rgba(250, 204, 21, 0.4);
      --hot-pink: #ec4899;
      --hot-pink-glow: rgba(236, 72, 153, 0.4);
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.4);
      --red: #dc2626;
      --white: #ffffff;
      --gray: #71717a;
      
      /* Typography */
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'VT323', monospace;
    }
    
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-mono);
      background: var(--surface);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Grid Background Effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--surface-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--surface-border) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    
    /* Scanline Effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
      pointer-events: none;
      z-index: 1000;
      opacity: 0.3;
    }
    
    .container {
      max-width: 700px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    
    /* HEADER - Aggressive typography */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }
    
    .logo-wrapper {
      display: inline-block;
      transform: skewX(-12deg);
      background: var(--neon-yellow);
      padding: 1rem 2rem;
      border: 3px solid var(--white);
      box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    
    .logo-wrapper:hover {
      transform: skewX(0deg);
      box-shadow: 3px 3px 0px rgba(255, 255, 255, 0.5);
    }
    
    .logo {
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      color: var(--surface);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transform: skewX(12deg);
      display: block;
      line-height: 1;
    }
    
    .tagline {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--cyan);
      margin-top: 1.5rem;
      text-shadow: 0 0 20px var(--cyan-glow);
    }
    
    /* FORM Container - Sharp edges */
    .form-container {
      background: var(--surface-light);
      border: 3px solid var(--surface-border);
      padding: 2rem;
      position: relative;
      transform: skewX(-4deg);
      box-shadow: 8px 8px 0px rgba(236, 72, 153, 0.3);
    }
    
    .form-container:hover {
      border-color: var(--hot-pink);
    }
    
    .form {
      transform: skewX(4deg);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    /* Input Fields - No rounded corners */
    .input-group {
      position: relative;
    }
    
    .input-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gray);
      margin-bottom: 0.5rem;
      padding-left: 0.5rem;
    }
    
    input {
      width: 100%;
      padding: 1.25rem 1rem;
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: var(--surface);
      border: 2px solid var(--surface-border);
      border-radius: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      outline: none;
    }
    
    input::placeholder {
      color: var(--gray);
      opacity: 0.5;
    }
    
    input:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 20px var(--neon-yellow-glow);
      background: var(--surface-light);
    }
    
    input:hover:not(:focus) {
      border-color: var(--cyan);
    }
    
    /* Submit Button - Aggressive styling */
    .submit-btn {
      width: 100%;
      padding: 1.5rem;
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--surface);
      background: var(--neon-yellow);
      border: 3px solid var(--neon-yellow);
      border-radius: 0;
      cursor: pointer;
      transform: skewX(-12deg);
      box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    
    .submit-btn::before {
      content: '> ';
    }
    
    .submit-btn::after {
      content: ' <';
    }
    
    .submit-btn:hover {
      transform: skewX(0deg);
      background: var(--white);
      border-color: var(--white);
      box-shadow: 3px 3px 0px rgba(250, 204, 21, 0.5);
      text-shadow: none;
    }
    
    .submit-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px rgba(250, 204, 21, 0.5);
    }
    
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: skewX(-12deg);
      box-shadow: none;
    }
    
    /* Result Section */
    .result {
      margin-top: 2rem;
      padding: 2rem;
      background: var(--surface);
      border: 3px solid var(--hot-pink);
      border-radius: 0;
      display: none;
      position: relative;
      transform: skewX(-4deg);
      box-shadow: 8px 8px 0px rgba(236, 72, 153, 0.3);
      animation: glitchIn 0.4s ease;
    }
    
    @keyframes glitchIn {
      0% {
        opacity: 0;
        transform: skewX(-4deg) translateX(-20px);
        clip-path: inset(0 100% 0 0);
      }
      20% {
        clip-path: inset(0 80% 0 0);
      }
      40% {
        clip-path: inset(0 20% 0 0);
      }
      60% {
        clip-path: inset(0 60% 0 0);
      }
      80% {
        clip-path: inset(0 0 0 0);
      }
      100% {
        opacity: 1;
        transform: skewX(-4deg) translateX(0);
      }
    }
    
    .result.visible {
      display: block;
    }
    
    .result-content {
      transform: skewX(4deg);
    }
    
    .result-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--surface-border);
    }
    
    .result-status {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 20px var(--neon-yellow-glow);
    }
    
    .result-title {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--hot-pink);
    }
    
    .result-field {
      margin-bottom: 1.5rem;
    }
    
    .result-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gray);
      margin-bottom: 0.5rem;
    }
    
    .result-value {
      background: var(--surface-light);
      border: 2px solid var(--cyan);
      padding: 1rem;
      transform: skewX(-4deg);
      transition: all 0.2s ease;
    }
    
    .result-value:hover {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 20px var(--neon-yellow-glow);
    }
    
    .result-link {
      display: block;
      font-family: var(--font-mono);
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--cyan);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      word-break: break-all;
      transform: skewX(4deg);
      transition: all 0.2s ease;
    }
    
    .result-link:hover {
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow-glow);
    }
    
    /* Stats Grid */
    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    
    .stat-item {
      background: var(--surface-light);
      border: 2px solid var(--surface-border);
      padding: 1rem;
      text-align: center;
      transform: skewX(-4deg);
      transition: all 0.2s ease;
    }
    
    .stat-item:hover {
      border-color: var(--hot-pink);
      transform: skewX(-4deg) scale(1.05);
    }
    
    .stat-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gray);
      margin-bottom: 0.5rem;
    }
    
    .stat-value {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow-glow);
    }
    
    /* Action Buttons */
    .result-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .action-button {
      flex: 1;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: transparent;
      border: 2px solid var(--cyan);
      border-radius: 0;
      color: var(--cyan);
      cursor: pointer;
      transform: skewX(-8deg);
      transition: all 0.2s ease;
      box-shadow: 4px 4px 0px rgba(34, 211, 238, 0.2);
    }
    
    .action-button:hover {
      background: var(--cyan);
      color: var(--surface);
      transform: skewX(0deg);
      box-shadow: 2px 2px 0px rgba(34, 211, 238, 0.5);
    }
    
    .action-button.copy-btn {
      border-color: var(--neon-yellow);
      color: var(--neon-yellow);
      box-shadow: 4px 4px 0px rgba(250, 204, 21, 0.2);
    }
    
    .action-button.copy-btn:hover {
      background: var(--neon-yellow);
      color: var(--surface);
      box-shadow: 2px 2px 0px rgba(250, 204, 21, 0.5);
    }
    
    /* QR Section */
    .qr-section {
      margin-top: 1.5rem;
      text-align: center;
      padding-top: 1.5rem;
      border-top: 2px solid var(--surface-border);
    }
    
    .qr-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gray);
      margin-bottom: 1rem;
    }
    
    .qr-container {
      display: inline-block;
      background: var(--white);
      padding: 1rem;
      border: 3px solid var(--white);
      transform: skewX(-4deg);
      box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.1);
    }
    
    .qr-image {
      width: 150px;
      height: 150px;
      display: block;
      filter: contrast(1.2);
    }
    
    /* Footer */
    .footer {
      margin-top: 3rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gray);
    }
    
    .footer::before,
    .footer::after {
      content: '//';
      color: var(--hot-pink);
      margin: 0 1rem;
    }
    
    /* Admin Link */
    .admin-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--surface-border);
      transform: skewX(-8deg);
      transition: all 0.2s ease;
    }
    
    .admin-link:hover {
      color: var(--hot-pink);
      border-color: var(--hot-pink);
      background: rgba(236, 72, 153, 0.1);
    }
    
    /* Error States */
    .error {
      background: rgba(220, 38, 38, 0.1);
      border: 2px solid var(--red);
      color: var(--red);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 1rem;
      transform: skewX(-4deg);
      display: none;
    }
    
    .error.visible {
      display: block;
      animation: glitchIn 0.3s ease;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .form-container { padding: 1.5rem; }
      .result-stats { grid-template-columns: 1fr; }
      .result-actions { flex-direction: column; }
      .logo-wrapper { padding: 0.75rem 1.5rem; }
    }
    
    /* Glitch Animation for logo on hover */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    
    .glitch-effect {
      animation: glitch 0.3s ease infinite;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentVariant = urlParams.get('variant');
      if (currentVariant) {
        localStorage.setItem('shrtname_variant', currentVariant);
      }
    })();
  </script>

  <div class="container">
    <header class="header">
      <div class="logo-wrapper">
        <h1 class="logo">SHRT.NAME</h1>
      </div>
      <p class="tagline">// COMPRESS_THE_INTERNET //</p>
    </header>

    <div class="form-container">
      <form id="shorten-form" class="form">
        <div class="input-group">
          <label class="input-label">TARGET_URL [REQUIRED]</label>
          <input type="url" id="url-input" placeholder="HTTPS://EXAMPLE.COM/VERY/LONG/URL" required autocomplete="off" />
        </div>

        <div class="input-group">
          <label class="input-label">CUSTOM_CODE [OPTIONAL]</label>
          <input type="text" id="code-input" placeholder="CUSTOM_SLUG" autocomplete="off" />
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">EXECUTE_SHORTEN</button>
      </form>
    </div>

    <div id="error" class="error"></div>

    <div id="result" class="result">
      <div class="result-content">
        <div class="result-header">
          <span class="result-status">[OK]</span>
          <span class="result-title">COMPRESSION_SUCCESSFUL</span>
        </div>

        <div class="result-field">
          <label class="result-label">SHORTENED_URL</label>
          <div class="result-value">
            <a href="#" id="short-url" target="_blank" class="result-link"></a>
          </div>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">CLICKS</span>
            <span class="stat-value" id="stat-clicks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">TYPE</span>
            <span class="stat-value" id="stat-type">AUTO</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">CODE</span>
            <span class="stat-value" id="stat-code"></span>
          </div>
        </div>

        <div class="result-actions">
          <button class="action-button copy-btn" id="copy-btn">COPY_TO_CLIPBOARD</button>
          <button class="action-button stats-btn" id="view-stats-btn">VIEW_ANALYTICS</button>
        </div>

        <div class="qr-section">
          <span class="qr-label">QR_CODE_GENERATED</span>
          <div class="qr-container">
            <img id="qr-code" src="" alt="QR CODE" class="qr-image" loading="lazy">
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      SYSTEM_ONLINE // 2024 // ZERO_COST_OPERATION
    </footer>
  </div>

  <a href="/admin" class="admin-link">[ADMIN]</a>

  <script>
    // Load saved variant preference and navigate to local variant pages.
    const variantFiles = {
      synthwave: 'synthwave.html',
      cyberglitch: 'cyberglitch.html',
      luxury: 'luxury.html',
      playful: 'playful.html',
      industrial: 'industrial.html',
      brutalist: 'brutalist.html',
      artdeco: 'artdeco.html',
      editorial: 'editorial.html',
      'maximalist-chaos': 'maximalist-chaos.html',
      organic: 'organic.html',
      softpastel: 'softpastel.html',
      'retro-futurystyczny': 'retro-futurystyczny.html'
    };

    const savedVariant = localStorage.getItem('shrtname_variant');
    if (savedVariant && savedVariant !== 'cyberglitch') {
      const targetFile = variantFiles[savedVariant];
      if (targetFile && !window.location.pathname.endsWith(targetFile)) {
        window.location.href = targetFile;
      }
    }

    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const shortUrl = document.getElementById('short-url');
    const statClicks = document.getElementById('stat-clicks');
    const statType = document.getElementById('stat-type');
    const statCode = document.getElementById('stat-code');
    const copyBtn = document.getElementById('copy-btn');
    const viewStatsBtn = document.getElementById('view-stats-btn');
    const qrCode = document.getElementById('qr-code');

    function showError(message) {
      error.textContent = '[ERROR] ' + message;
      error.classList.add('visible');
      setTimeout(() => error.classList.remove('visible'), 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('visible');

      const url = urlInput.value.trim();
      const code = codeInput.value.trim();

      if (!url) {
        showError('URL_REQUIRED');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'PROCESSING...';

      try {
        const response = await fetch('https://shrt-name.p-wesolowski.workers.dev/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, code: code || null })
        });

        const data = await response.json();

        if (data.success) {
          shortUrl.href = data.short_url;
          shortUrl.textContent = data.short_url;
          statClicks.textContent = '0';
          statType.textContent = data.custom_code ? 'CUSTOM' : 'AUTO';
          statCode.textContent = data.code;

          const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(data.short_url) + '&color=22d3ee&bgcolor=09090b';
          qrCode.src = qrUrl;

          result.classList.add('visible');
          result.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          showError(data.error || 'COMPRESSION_FAILED');
        }
      } catch (err) {
        console.error('Error:', err);
        showError('NETWORK_ERROR');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'EXECUTE_SHORTEN';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.textContent);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'COPIED!';
        setTimeout(() => copyBtn.textContent = originalText, 2000);
      } catch (err) {
        showError('COPY_FAILED');
      }
    });

    viewStatsBtn.addEventListener('click', async () => {
      const code = statCode.textContent;
      try {
        const response = await fetch('https://shrt-name.p-wesolowski.workers.dev/api/stats/' + code);
        const data = await response.json();

        if (data.success) {
          alert('[STATISTICS]\\n\\nCODE: ' + data.code + '\\nCLICKS: ' + data.clicks + '\\nCREATED: ' + new Date(data.created_at).toLocaleString().toUpperCase());
        } else {
          showError('STATS_NOT_FOUND');
        }
      } catch (err) {
        showError('STATS_FETCH_ERROR');
      }
    });

    // Add glitch effect to logo on random intervals
    const logoWrapper = document.querySelector('.logo-wrapper');
    setInterval(() => {
      if (Math.random() > 0.9) {
        logoWrapper.classList.add('glitch-effect');
        setTimeout(() => logoWrapper.classList.remove('glitch-effect'), 300);
      }
    }, 3000);
  </script>

    <span class="selector-label">STYLE:</span>
    <a href="synthwave.html" class="style-link">🌆 SYNTH</a>
    <a href="cyberglitch.html" class="style-link active">⚡ CYBER</a>
    <a href="luxury.html" class="style-link">💎 LUXURY</a>

    <a href="industrial.html" class="style-link">🏭 INDUST</a>
