  <footer style="text-align: center; padding: 2rem; font-family: monospace; font-size: 0.75rem; color: #666; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3rem; border-top: 1px solid #333;">

  <script>
    // DOM Elements
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('url');
    const customCodeInput = document.getElementById('customCode');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('shortUrl');
    const originalUrl = document.getElementById('originalUrl');
    const copyBtn = document.getElementById('copyBtn');
    const visitBtn = document.getElementById('visitBtn');
    const qrSection = document.getElementById('qrSection');
    const qrCode = document.getElementById('qrCode');
    const statsSection = document.getElementById('statsSection');
    const clickCount = document.getElementById('clickCount');
    const createdAt = document.getElementById('createdAt');
    const codeType = document.getElementById('codeType');

    // API Base
    const API_BASE = window.location.origin;

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const customCode = customCodeInput.value.trim();

      if (!url) {
        showError('Please enter a URL');
        return;
      }

      if (!isValidUrl(url)) {
        showError('Please enter a valid URL');
        return;
      }

      hideError();
      hideResult();
      showLoading();

      try {
        const response = await fetch(`${API_BASE}/api/shorten`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            url: url,
            code: customCode || undefined
          }),
        });

        const data = await response.json();

        if (response.ok) {
          showResult(data);
        } else {
          showError(data.error || 'Failed to shorten URL');
        }
      } catch (err) {
        showError('Network error. Please try again.');
        console.error(err);
      } finally {
        hideLoading();
      }
    });

    // Copy button
    copyBtn.addEventListener('click', async () => {
      const url = shortUrl.textContent;
      try {
        await navigator.clipboard.writeText(url);
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => {
          copyBtn.textContent = '📋 Copy Link';
        }, 2000);
      } catch (err) {
        showError('Failed to copy to clipboard');
      }
    });

    // Visit button
    visitBtn.addEventListener('click', () => {
      window.open(shortUrl.textContent, '_blank');
    });

    // Validate URL
    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    // Show/Hide helpers
    function showLoading() {
      loading.style.display = 'block';
    }

    function hideLoading() {
      loading.style.display = 'none';
    }

    function showError(message) {
      error.textContent = message;
      error.style.display = 'block';
    }

    function hideError() {
      error.style.display = 'none';
      error.textContent = '';
    }

    function showResult(data) {
      shortUrl.textContent = data.short_url;
      originalUrl.textContent = data.original_url;
      result.classList.add('show');
      qrSection.classList.add('show');

      // Generate QR code
      generateQRCode(data.short_url);

      // Fetch stats
      fetchStats(data.code);
    }

    function hideResult() {
      result.classList.remove('show');
      qrSection.classList.remove('show');
      statsSection.classList.remove('show');
    }

    // Generate QR code
    function generateQRCode(url) {
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&bgcolor=faf8f5&color=2d5a3d`;
      qrCode.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
    }

    // Fetch stats
    async function fetchStats(code) {
      try {
        const response = await fetch(`${API_BASE}/api/stats/${code}`);
        const data = await response.json();

        if (response.ok) {
          statsSection.classList.add('show');
          clickCount.textContent = data.clicks;
          createdAt.textContent = new Date(data.created_at).toLocaleDateString();
          codeType.textContent = data.custom_code ? 'Custom' : 'Auto-generated';
        }
      } catch (err) {
        console.error('Failed to fetch stats:', err);
      }
    }

    // Prevent Enter in custom code
    customCodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
      }
    });

    // Focus URL input on load
    urlInput.focus();

    // Add subtle leaf floating animation
    document.addEventListener('DOMContentLoaded', () => {
      const leaves = ['🌿', '🍃', '🌱', '🌸'];
      setInterval(() => {
        if (Math.random() < 0.3) {
          const leaf = document.createElement('div');
          leaf.textContent = leaves[Math.floor(Math.random() * leaves.length)];
          leaf.style.position = 'fixed';
          leaf.style.left = Math.random() * 100 + 'vw';
          leaf.style.top = '-30px';
          leaf.style.fontSize = '1.5rem';
          leaf.style.opacity = '0.3';
          leaf.style.pointerEvents = 'none';
          leaf.style.zIndex = '0';
          leaf.style.transition = 'transform 5s linear, opacity 5s linear';
          document.body.appendChild(leaf);

          setTimeout(() => {
            leaf.style.transform = 'translateY(' + (window.innerHeight + 100) + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg)';
            leaf.style.opacity = '0';
          }, 100);

          setTimeout(() => {
            leaf.remove();
          }, 5100);
        }
      }, 2000);
    });
  </script>
