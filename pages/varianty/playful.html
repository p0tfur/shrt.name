<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shrt.name 🎈 Shorten Your Links!</title>
  <meta name="description" content="Fun URL shortener that makes shortening links feel like playtime!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-pastel: #FFB6D9;
      --pink-bright: #FF69B4;
      --yellow: #FFD93D;
      --orange: #FF6B35;
      --blue-pastel: #6BCB77;
      --blue-bright: #4D96FF;
      --purple-pastel: #DDA0DD;
      --purple-bright: #9B59B6;
      --bg-cream: #FFF8E7;
      --bg-dots: #FFE5B4;
      --font-display: 'Fredoka', cursive;
      --font-body: 'Nunito', sans-serif;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 30px;
      --radius-xl: 50px;
      --transition-bounce: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 0.15s ease-out;
    }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-body);
      font-weight: 600;
      background: var(--bg-cream);
      color: #4A4A4A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      line-height: 1.5;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, var(--pink-pastel) 2px, transparent 2px);
      background-size: 30px 30px;
      opacity: 0.3;
      animation: dotFloat 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes dotFloat {
      0%, 100% { background-position: 0 0; }
      50% { background-position: 30px 30px; }
    }
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .shape {
      position: absolute;
      border-radius: 50%;
      animation: floatUp 15s ease-in-out infinite;
    }
    .shape-1 {
      width: 80px;
      height: 80px;
      background: var(--pink-pastel);
      left: 10%;
      top: 20%;
      animation-delay: 0s;
      opacity: 0.6;
    }
    .shape-2 {
      width: 120px;
      height: 120px;
      background: var(--yellow);
      right: 15%;
      top: 40%;
      animation-delay: 2s;
      opacity: 0.5;
    }
    .shape-3 {
      width: 60px;
      height: 60px;
      background: var(--blue-pastel);
      left: 20%;
      bottom: 30%;
      animation-delay: 4s;
      opacity: 0.7;
    }
    .shape-4 {
      width: 100px;
      height: 100px;
      background: var(--purple-pastel);
      right: 25%;
      bottom: 20%;
      animation-delay: 1s;
      opacity: 0.5;
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(90deg); }
      50% { transform: translateY(-10px) rotate(180deg); }
      75% { transform: translateY(-25px) rotate(270deg); }
    }
    .container {
      max-width: 600px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .header {
      text-align: center;
      margin-bottom: var(--space-lg);
      animation: bounceIn 0.8s ease-out;
    }
    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(-50px);
      }
      50% {
        transform: scale(1.1) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .logo {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      color: var(--pink-bright);
      text-shadow:
        3px 3px 0 var(--yellow),
        6px 6px 0 var(--blue-bright);
      margin-bottom: var(--space-sm);
      display: inline-block;
      transition: transform var(--transition-bounce);
    }
    .logo:hover {
      transform: rotate(-5deg) scale(1.1);
    }
    .logo-emoji {
      display: inline-block;
      font-size: 0.8em;
      animation: wiggle 1s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .tagline {
      font-family: var(--font-body);
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--purple-bright);
      background: white;
      display: inline-block;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-xl);
      box-shadow: 0 4px 0 var(--purple-pastel);
      transform: rotate(-2deg);
    }
    .form-card {
      background: white;
      padding: var(--space-lg);
      border-radius: var(--radius-xl);
      box-shadow:
        0 8px 0 var(--pink-pastel),
        0 16px 0 var(--yellow),
        0 24px 32px rgba(0, 0, 0, 0.1);
      border: 4px solid white;
      position: relative;
      animation: slideUp 0.6s ease-out 0.2s backwards;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px) rotate(3deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
    }
    .form-card::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: linear-gradient(135deg, var(--pink-pastel), var(--yellow), var(--blue-pastel));
      border-radius: calc(var(--radius-xl) + 10px);
      z-index: -1;
      opacity: 0.8;
    }
    .form-group {
      margin-bottom: var(--space-md);
      animation: popIn 0.4s ease-out backwards;
    }
    .form-group:nth-child(1) { animation-delay: 0.3s; }
    .form-group:nth-child(2) { animation-delay: 0.4s; }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .form-label {
      display: block;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--purple-bright);
      margin-bottom: var(--space-sm);
    }
    .form-input {
      width: 100%;
      padding: var(--space-md) var(--space-sm);
      font-family: var(--font-body);
      font-size: 1.125rem;
      font-weight: 600;
      color: #4A4A4A;
      background: var(--bg-cream);
      border: 3px solid var(--pink-pastel);
      border-radius: var(--radius-md);
      transition: all var(--transition-bounce);
    }
    .form-input::placeholder {
      color: var(--pink-bright);
      font-weight: 400;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--blue-bright);
      background: white;
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(77, 150, 255, 0.2);
    }
    .form-input:focus::placeholder {
      color: var(--blue-bright);
    }
    .submit-button {
      width: 100%;
      padding: var(--space-md);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--pink-bright), var(--orange));
      border: none;
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: all var(--transition-bounce);
      box-shadow:
        0 6px 0 var(--pink-pastel),
        0 12px 24px rgba(255, 105, 180, 0.3);
      animation: bounceIn 0.5s ease-out 0.5s backwards;
      position: relative;
      overflow: hidden;
    }
    .submit-button::before {
      content: '🚀';
      position: absolute;
      right: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2em;
    }
    .submit-button:hover {
      transform: scale(1.05) translateY(-4px);
      box-shadow:
        0 10px 0 var(--pink-pastel),
        0 20px 32px rgba(255, 105, 180, 0.4);
    }
    .submit-button:active {
      transform: scale(0.95) translateY(0);
    }
    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: var(--space-lg);
      padding: var(--space-lg);
      background: white;
      border-radius: var(--radius-xl);
      box-shadow:
        0 8px 0 var(--blue-pastel),
        0 16px 32px rgba(77, 150, 255, 0.2);
      border: 4px solid white;
      position: relative;
      opacity: 0;
      animation: resultPop 0.6s ease-out forwards;
    }
    .result::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      background: linear-gradient(135deg, var(--blue-pastel), var(--purple-pastel), var(--yellow));
      border-radius: calc(var(--radius-xl) + 8px);
      z-index: -1;
      opacity: 0.8;
    }
    @keyframes resultPop {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .result.hidden {
      display: none;
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      padding: var(--space-sm);
      background: var(--bg-dots);
      border-radius: var(--radius-md);
    }
    .result-emoji {
      font-size: 2rem;
      animation: bounce 0.6s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .result-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--purple-bright);
    }
    .result-content {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .result-field {
      padding: var(--space-sm);
      background: var(--bg-cream);
      border-radius: var(--radius-md);
      border: 3px solid var(--blue-pastel);
    }
    .result-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--purple-bright);
      margin-bottom: var(--space-xs);
    }
    .short-url {
      display: block;
      font-family: var(--font-body);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--blue-bright);
      text-decoration: none;
      word-break: break-all;
      transition: all var(--transition-bounce);
    }
    .short-url:hover {
      transform: scale(1.05);
      text-shadow: 2px 2px 0 var(--pink-pastel);
    }
    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
    }
    .stat-item {
      text-align: center;
      padding: var(--space-sm);
      background: white;
      border-radius: var(--radius-md);
      border: 3px solid var(--purple-pastel);
      transition: transform var(--transition-bounce);
    }
    .stat-item:hover {
      transform: scale(1.1) rotate(3deg);
    }
    .stat-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--purple-bright);
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--pink-bright);
    }
    .result-actions {
      display: flex;
      gap: var(--space-sm);
    }
    .action-button {
      flex: 1;
      padding: var(--space-sm);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: white;
      background: var(--blue-bright);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-bounce);
      position: relative;
      overflow: hidden;
    }
    .action-button:first-child {
      background: var(--yellow);
      color: #4A4A4A;
    }
    .action-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transition: left 0.3s ease-out;
    }
    .action-button:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }
    .action-button:hover::before {
      left: 100%;
    }
    .qr-section {
      text-align: center;
      margin-top: var(--space-md);
      padding: var(--space-sm);
      background: var(--bg-dots);
      border-radius: var(--radius-lg);
    }
    .qr-container {
      display: inline-block;
      padding: var(--space-sm);
      background: white;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      border: 4px solid var(--pink-pastel);
      animation: wiggle 2s ease-in-out infinite;
    }
    .qr-image {
      width: 150px;
      height: 150px;
      display: block;
    }
    .footer {
      margin-top: var(--space-lg);
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.875rem;
      color: var(--purple-bright);
    }
    .footer span {
      display: inline-block;
      animation: bounce 1.5s ease-in-out infinite;
    }
    .footer span:nth-child(1) { animation-delay: 0s; }
    .footer span:nth-child(2) { animation-delay: 0.2s; }
    .footer span:nth-child(3) { animation-delay: 0.4s; }
    @media (max-width: 768px) {
      body {
        padding: var(--space-sm);
      }
      .container {
        max-width: 100%;
      }
      .logo {
        font-size: clamp(2rem, 12vw, 3rem);
      }
      .form-card {
        padding: var(--space-md);
      }
      .result-stats {
        grid-template-columns: 1fr;
      }
      .result-actions {
        flex-direction: column;
      }
      .floating-shapes .shape {
        opacity: 0.3;
      }
    }
  </style>
</head>
<body>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentVariant = urlParams.get('variant');
      if (!currentVariant) {
        const savedVariant = localStorage.getItem('shrtname_variant');
        if (savedVariant) {
          window.location.href = '/?variant=' + savedVariant;
        }
      } else {
        localStorage.setItem('shrtname_variant', currentVariant);
      }
    })();
  </script>

  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <div class="container">
    <header class="header">
      <h1 class="logo">
        <span class="logo-emoji">🎈</span>
        shrt.name
      </h1>
      <p class="tagline">Make Your Links Fun! 🎉</p>
    </header>

    <form id="shorten-form" class="form-card">
      <div class="form-group">
        <label class="form-label">🔗 Your Link</label>
        <input type="url" id="url-input" class="form-input" placeholder="https://" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label class="form-label">✨ Custom Name</label>
        <input type="text" id="code-input" class="form-input" placeholder="my-cool-link" autocomplete="off" />
      </div>

      <button type="submit" class="submit-button" id="submit-btn">
        Make it Short!
      </button>
    </form>

    <div id="result" class="result hidden">
      <div class="result-header">
        <span class="result-emoji">🎊</span>
        <h2 class="result-title">Yay! Link Created!</h2>
      </div>

      <div class="result-content">
        <div class="result-field">
          <label class="result-label">📌 Your Short Link</label>
          <a href="#" id="short-url" target="_blank" class="short-url"></a>
        </div>

        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">👆 Clicks</span>
            <span class="stat-value" id="stat-clicks">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">🎯 Type</span>
            <span class="stat-value" id="stat-type">Auto</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">🏷️ Code</span>
            <span class="stat-value" id="stat-code"></span>
          </div>
        </div>

        <div class="result-actions">
          <button class="action-button copy-btn" id="copy-btn">
            📋 Copy It!
          </button>
          <button class="action-button stats-btn" id="view-stats-btn">
            📊 See Stats
          </button>
        </div>

        <div class="qr-section">
          <div class="qr-container">
            <img id="qr-code" src="" alt="QR Code" class="qr-image" loading="lazy">
          </div>
        </div>
      </div>
    </div>

    
  <footer style="text-align: center; padding: 2rem; font-family: monospace; font-size: 0.75rem; color: #666; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3rem; border-top: 1px solid #333;">
    shrt.name // 2026 // MIT // BUILD: 2026.02.15.01
  </footer>

  </div>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url-input');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');
    const shortUrl = document.getElementById('short-url');
    const statClicks = document.getElementById('stat-clicks');
    const statType = document.getElementById('stat-type');
    const statCode = document.getElementById('stat-code');
    const copyBtn = document.getElementById('copy-btn');
    const viewStatsBtn = document.getElementById('view-stats-btn');
    const qrCode = document.getElementById('qr-code');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = urlInput.value.trim();
      const code = codeInput.value.trim();

      if (!url) {
        alert('🙈 Oops! Please add a URL first!');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '🔄 Working on it...';

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, code: code || null })
        });

        const data = await response.json();

        if (data.success) {
          shortUrl.href = data.short_url;
          shortUrl.textContent = data.short_url;
          statClicks.textContent = '0';
          statType.textContent = data.custom_code ? 'Custom' : 'Auto';
          statCode.textContent = data.code;

          const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(data.short_url) + '&color=FF69B4&bgcolor=FFF8E7';
          qrCode.src = qrUrl;

          result.classList.remove('hidden');
          result.scrollIntoView({ behavior: 'smooth', block: 'center' });

          // Fun confetti effect
          createConfetti();
        } else {
          alert('😢 ' + (data.error || 'Something went wrong!'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('😵 Network trouble! Try again!');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Make it Short!';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.textContent);
        alert('🎉 Copied to clipboard!');
      } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = shortUrl.textContent;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('🎉 Copied to clipboard!');
      }
    });

    viewStatsBtn.addEventListener('click', async () => {
      const code = statCode.textContent;
      const response = await fetch('/api/stats/' + code);
      const data = await response.json();

      if (data.success) {
        alert('📊 Stats!\n\nClicks: ' + data.clicks + '\nCreated: ' + new Date(data.created_at).toLocaleString());
      }
    });

    // Simple confetti effect
    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.cssText = `
          position: fixed;
          width: 10px;
          height: 10px;
          background: ${['#FFB6D9', '#FFD93D', '#6BCB77', '#4D96FF', '#DDA0DD'][Math.floor(Math.random() * 5)]};
          left: ${Math.random() * 100}vw;
          top: -10px;
          border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
          animation: fall ${2 + Math.random() * 2}s linear forwards;
          z-index: 1000;
          pointer-events: none;
        `;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }
    }

    // Add fall animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>

  <div class="style-selector">
    <span class="selector-label">STYLE:</span>
    <a href="/?variant=cyberglitch" class="style-link ">⚡ CYBER</a>
    <a href="/?variant=synthwave" class="style-link ">🌆 SYNTH</a>
    <a href="/?variant=luxury" class="style-link ">💎 LUXURY</a>
    <a href="/?variant=playful" class="style-link active">🎈 PLAY</a>
    <a href="/?variant=industrial" class="style-link ">🏭 INDUST</a>
    <a href="/?variant=brutalist" class="style-link ">⬛ BRUTAL</a>
  </div>
